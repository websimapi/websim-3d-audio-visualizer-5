<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Audio Visualizer</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.149.0/examples/jsm/",
                "config": "./config.js"
            }
        }
    </script>
</head>
<body>
    <div id="visualizer-container"></div>

    <div class="controls">
        <button id="startButton">Start Visualizer</button>
        <div id="status">Select a tab to capture</div>
        <div class="settings">
            <label for="sensitivity">Sensitivity:</label>
            <input type="range" id="sensitivity" min="0.5" max="5" step="0.1" value="2">

            <label for="smoothing">Smoothing:</label>
            <input type="range" id="smoothing" min="0" max="0.9" step="0.05" value="0.5">

            <select id="visualizationType">
                <option value="bars">3D Bars</option>
                <option value="sphere">Reactive Sphere</option>
                <option value="terrain">Terrain Wave</option>
                <option value="galaxy">Particle Galaxy</option>
                <option value="ai" disabled>AI Generated</option>
            </select>

            <div class="toggle-switch">
                 <label for="aiToggle">Auto AI Generation:</label>
                 <input type="checkbox" id="aiToggle" class="toggle-checkbox">
                 <label for="aiToggle" class="toggle-label"></label>
            </div>
            <div id="aiStatus" class="ai-status"></div>
        </div>
    </div>

    <script type="module" src="visualizer.js"></script>

</body>
</html>
